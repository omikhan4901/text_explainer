name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # On main every run finishes (the Windows build is slow); PR runs replace each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (core and front end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # The runner image already has the system libraries; --with-deps can hang on apt.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: scripts/check.sh
        env:
          E2E: "1"

  windows:
    name: Windows app (lint, test, installer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the front end (the app embeds it)
        run: npx vite build --logLevel warn
      - name: Fetch the pinned llama.cpp build (bundled with the app)
        run: python scripts/fetch-llama.py
      - name: Build the dictionary (bundled with the app)
        run: python scripts/build-dictionary.py
      - name: Lint the whole workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test the whole workspace
        run: cargo test --workspace
      - name: Build the installer
        run: npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: text-explainer-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
