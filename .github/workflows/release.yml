name: Release (draft)

# Builds the Windows installer and attaches it to a DRAFT GitHub Release. Drafts are not
# public: review the notes, then press "Publish release" on GitHub when ready.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match src-tauri/tauri.conf.json), e.g. 0.1.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($conf.version -ne "${{ inputs.version }}") {
            throw "tauri.conf.json says $($conf.version), not ${{ inputs.version }}"
          }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: python scripts/fetch-llama.py
      - run: python scripts/build-dictionary.py
      - run: cargo test --workspace
      - run: npx tauri build --ci
      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          Text Explainer ${{ inputs.version }} for Windows 10 and 11 (64-bit).

          Select text anywhere, press Ctrl+Shift+Space (or copy it twice), and a readable
          version appears next to it. Runs fully offline after a one-time model download.

          The installer isn't code-signed yet, so Windows SmartScreen will warn: choose
          "More info" and then "Run anyway".

          SHA-256 of $($exe.Name): $hash
          "@
          gh release create "v${{ inputs.version }}" $exe.FullName --draft --title "Text Explainer ${{ inputs.version }}" --notes $notes --target $env:GITHUB_SHA
