[package]
name = "text-explainer"
description = "Select text anywhere, get a readable version. Fully offline."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "text-explainer"

[lib]
name = "text_explainer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
te-core.workspace = true
te-win.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rustls.workspace = true

[lints]
workspace = true
